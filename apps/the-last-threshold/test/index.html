<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Книга Порога — Пролог</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050706;color:#eee;font-family:system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#game,canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#ui{position:fixed;inset:0;pointer-events:none}.hud{position:absolute;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:7px}.card{background:rgba(8,11,12,.82);border:1px solid #6d6247;border-radius:11px;padding:7px 9px;font-size:11px;backdrop-filter:blur(5px)}.lab{font-size:8px;letter-spacing:.14em;color:#b9a978;text-transform:uppercase}.big{font-weight:900}
#objective{position:absolute;top:70px;left:50%;transform:translateX(-50%);max-width:88vw;padding:8px 12px;text-align:center;font-size:11px;border:1px solid #665b42;border-radius:11px;background:rgba(7,11,12,.8)}
#bookBtn{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 75px);width:72px;height:72px;border-radius:18px;border:1px solid #b49b60;background:rgba(28,23,15,.92);color:#f1dda0;font-weight:900;pointer-events:auto;box-shadow:0 7px 20px #0008}
#toast{position:absolute;left:50%;bottom:200px;transform:translate(-50%,12px);opacity:0;transition:.2s;max-width:88vw;padding:9px 13px;border:1px solid #9b8756;border-radius:10px;background:#090e0feF;font-size:12px;text-align:center}
#controls{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 8px);height:170px}.pad,.acts{pointer-events:auto;position:absolute;bottom:0}.pad{left:8px;width:172px;height:170px}.acts{right:8px;width:225px;height:170px}.pad button,.acts button{position:absolute;border:1px solid #8f8059;background:#091110e8;color:#efe7d0;border-radius:19px;font-weight:900}.pad button{width:65px;height:65px;font-size:23px}.up{left:53px}.down{left:53px;bottom:0}.left{left:0;top:52px}.right{right:0;top:52px}.acts button{width:94px;height:70px;font-size:12px}.jump{left:0;top:0}.act{right:0;top:0}.interact{left:0;bottom:0;width:217px!important}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#010405cc;backdrop-filter:blur(7px);pointer-events:auto}.panel{width:min(720px,90vw);padding:28px;border:1px solid #8f8058;border-radius:20px;background:#0b1010f5;box-shadow:0 20px 70px #000b}.panel h1,.panel h2{font-family:Georgia,serif;color:#e0c882;margin:0 0 12px}.panel h1{font-size:clamp(34px,8vw,68px);line-height:.9}.panel h2{font-size:clamp(24px,6vw,40px)}.panel p{line-height:1.55;color:#b8c1be}.btn{width:100%;margin-top:12px;padding:14px;border:1px solid #9e8d60;border-radius:11px;background:#17201d;color:#f0e8d1;font-weight:900;font-size:14px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice .btn{margin-top:10px}
.hidden{display:none!important}
.book{width:min(900px,94vw);height:min(700px,90vh);padding:18px;display:flex;flex-direction:column}.bookTop{display:flex;justify-content:space-between;align-items:center}.pages{display:flex;gap:12px;flex:1;min-height:0;margin-top:12px}.page{flex:1;min-width:0;overflow:auto;background:#d9caa0;color:#29261f;border:1px solid #8c7a50;border-radius:8px;padding:22px;font:16px/1.6 Georgia,serif;box-shadow:inset 0 0 40px #7b674522}.page h3{margin-top:0;color:#45391f}.sig{font-weight:900;font-size:22px;letter-spacing:.08em}.symbol{font-size:62px;text-align:center;color:#6f603e;margin:25px}
</style>
</head>
<body>
<div id="game"><canvas id="c"></canvas><div id="ui">
<div class="hud"><div class="card"><div class="lab">Герой</div><div class="big">РЕН</div></div><div class="card"><div class="lab">Память</div><div class="big" id="memory">0 / 3</div></div><div class="card"><div class="lab">Книга</div><div class="big" id="bookState">Закрыта</div></div></div>
<div id="objective">Найди книгу у входа в храм.</div>
<button id="bookBtn">КНИГА</button><div id="toast"></div>
<div id="controls"><div class="pad"><button class="up" data-k="up">▲</button><button class="down" data-k="down">▼</button><button class="left" data-k="left">◀</button><button class="right" data-k="right">▶</button></div><div class="acts"><button class="jump" data-a="jump">ПРЫЖОК</button><button class="act" data-a="attack">УДАР</button><button class="interact" data-a="interact">ВЗАИМОДЕЙСТВИЕ</button></div></div>
<div id="start" class="overlay"><div class="panel"><div class="lab">НОВАЯ ИГРА</div><h1>КНИГА<br>ПОРОГА</h1><p>Мира исчезла у древнего храма три дня назад. Рен приходит за ней и находит книгу без названия.</p><button class="btn" id="startBtn">Войти в храм</button></div></div>
<div id="book" class="overlay hidden"><div class="panel book"><div class="bookTop"><h2>Книга Порога</h2><button class="btn" id="closeBook" style="width:auto;margin:0;padding:9px 14px">Закрыть</button></div><div class="pages"><div class="page"><h3>Страница I</h3><div class="symbol">◈</div><p id="leftPage">«Назови того, кто вошёл».</p></div><div class="page"><h3>Страница II</h3><p id="rightPage">Пока здесь ничего нет.</p></div></div><div id="bookChoices" class="choice hidden"><button class="btn" data-choice="mira">ИСКАТЬ МИРУ</button><button class="btn" data-choice="self">ИСКАТЬ СЕБЯ</button></div></div></div>
<div id="modal" class="overlay hidden"><div class="panel"><h2 id="mTitle"></h2><p id="mBody"></p><button class="btn" id="mOk">Продолжить</button></div></div>
</div></div>
<script>
"use strict";
const c=document.getElementById("c"),x=c.getContext("2d");
const S={mode:"menu",t:0,book:false,named:false,chose:false,miraSeen:false,wallSolved:false,p:{x:90,y:436,w:42,h:64,vx:0,vy:0,ground:false,jumps:0,dir:1},keys:{},touch:{left:false,right:false},objective:"Найди книгу у входа в храм."};
const world={ground:{x:0,y:500,w:1500,h:40},door:{x:1360,y:330,w:70,h:170},bag:{x:290,y:430,w:54,h:45},wall:{x:1030,y:330,w:35,h:170}};
function resize(){const d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d}addEventListener("resize",resize);resize();
function toast(m,ms=1500){const e=document.getElementById("toast");e.textContent=m;e.style.opacity=1;e.style.transform="translate(-50%,0)";clearTimeout(toast.t);toast.t=setTimeout(()=>{e.style.opacity=0;e.style.transform="translate(-50%,12px)"},ms)}
function openBook(){if(S.mode==="menu")return;S.book=true;S.mode="book";document.getElementById("book").classList.remove("hidden");document.getElementById("bookState").textContent="Открыта";renderBook()}
function closeBook(){S.book=false;if(S.mode==="book")S.mode="play";document.getElementById("book").classList.add("hidden");document.getElementById("bookState").textContent="Закрыта"}
function renderBook(){const l=document.getElementById("leftPage"),r=document.getElementById("rightPage"),ch=document.getElementById("bookChoices");if(!S.named){l.innerHTML="«НАЗОВИ ТОГО, КТО ВОШЁЛ».<br><br><span class='sig'>РЕН</span><br><br>Первое имя записано.";S.named=true;r.textContent="На рисунке — знак двери храма. Под ним пустой круг.";if(!S.chose)ch.classList.remove("hidden")}else if(!S.chose){l.innerHTML="«КОГО ТЫ ИЩЕШЬ?»";ch.classList.remove("hidden")}else if(!S.wallSolved){l.innerHTML="МИРА — поиск не завершён.";r.innerHTML="«Порог узнаёт знак, но не человека».<br><br>Замочная скважина повторяет этот знак.";ch.classList.add("hidden")}else{l.innerHTML="«МИРА БЫЛА ЗДЕСЬ 11 МИНУТ ПОСЛЕ ТЕБЯ».<br><br><span class='sig'>11 ЛЕТ</span>";r.innerHTML="Запись меняется сама.<br><br><em>«Я не записывала это имя».</em>";ch.classList.add("hidden")}}
function choose(which){S.chose=true;document.getElementById("bookChoices").classList.add("hidden");document.getElementById("objective").textContent="Найди след Миры и открой символическую дверь.";S.objective="Найди след Миры и открой символическую дверь.";renderBook();closeBook();toast(which==="mira"?"Имя принято: МИРА":"Ты выбрал искать себя");}
document.getElementById("bookBtn").onclick=openBook;document.getElementById("closeBook").onclick=closeBook;
document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>choose(b.dataset.choice));
function start(){S.mode="play";document.getElementById("start").classList.add("hidden");toast("Сумка Миры лежит впереди.",1200)}
document.getElementById("startBtn").onclick=start;
document.getElementById("mOk").onclick=()=>document.getElementById("modal").classList.add("hidden");
function jump(){if(S.mode!=="play")return;const p=S.p;if(p.ground){p.vy=-600;p.ground=false;p.jumps=1}else if(p.jumps<2){p.vy=-520;p.jumps=2}}
function interact(){if(S.mode!=="play")return;const p=S.p;if(Math.abs(p.x-(world.bag.x+25))<100){S.named=true;S.mode="play";toast("Книга без названия. Открой её кнопкой КНИГА.",2200);document.getElementById("objective").textContent="Открой Книгу Порога.";return}
if(Math.abs(p.x-world.door.x)<105){S.wallSolved=true;document.getElementById("objective").textContent="Страница книги изменилась. Следуй глубже.";renderBook();toast("Замок узнал символ.",1300);return}
if(Math.abs(p.x-world.wall.x)<95&&!S.wallSolved){S.miraSeen=true;toast("На стене следы заканчиваются…",1000);openBook();return}
toast("Здесь ничего нет.",600)}
function attack(){toast("Рядом пока нет врага.",650)}
addEventListener("keydown",e=>{const k=e.key.toLowerCase();S.keys[k]=1;if(k==="e")interact();if(k===" ")jump();if(k==="b")openBook();if(["arrowleft","arrowright","arrowup","arrowdown","a","d","w","s"," ","b"].includes(k))e.preventDefault()});
addEventListener("keyup",e=>S.keys[e.key.toLowerCase()]=0);
document.querySelectorAll(".pad button").forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();if(k==="left"||k==="right")S.touch[k]=1};b.onpointerup=b.onpointercancel=b.onpointerleave=e=>{e.preventDefault();if(k==="left"||k==="right")S.touch[k]=0};});
document.querySelectorAll(".acts button").forEach(b=>b.onpointerdown=e=>{e.preventDefault();const a=b.dataset.a;if(a==="jump")jump();else if(a==="attack")attack();else interact()});
function update(dt){if(S.mode!=="play")return;const p=S.p,l=S.keys.arrowleft||S.keys.a||S.touch.left,r=S.keys.arrowright||S.keys.d||S.touch.right;p.vx=(r?1:0)-(l?1:0);if(p.vx)p.dir=p.vx;p.x+=p.vx*230*dt;p.x=Math.max(25,Math.min(1340,p.x));const old=p.y+p.h;p.vy+=1150*dt;p.y+=p.vy*dt;p.ground=false;if(old<=world.ground.y&&p.y+p.h>=world.ground.y){p.y=world.ground.y-p.h;p.vy=0;p.ground=true;p.jumps=0}
if(S.wallSolved&&p.x>1280&&Math.abs(p.y-400)<120){document.getElementById("mTitle").textContent="Мира";document.getElementById("mBody").textContent="Из глубины храма слышен голос: «Рен». Никого нет. Книга сама открывается.";document.getElementById("modal").classList.remove("hidden");S.wallSolved=false}
}
function draw(){const d=Math.min(devicePixelRatio||1,2),vw=innerWidth<700?760:1400,vh=540,sc=Math.min(c.width/vw,c.height/vh),ox=(c.width-vw*sc)/2,oy=(c.height-vh*sc)/2,cam=Math.max(0,Math.min(740,S.p.x-(innerWidth<700?260:450)));x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height);x.setTransform(sc,0,0,sc,ox,oy);const g=x.createLinearGradient(0,0,0,vh);g.addColorStop(0,"#172021");g.addColorStop(1,"#030506");x.fillStyle=g;x.fillRect(0,0,vw,vh);x.save();x.translate(-cam,0);
for(let i=0;i<14;i++){x.fillStyle=i%2?"#101718":"#0d1314";x.fillRect(i*115,120,18,380);x.fillStyle="#1d2727";x.fillRect(i*115+18,125,5,375)}
x.fillStyle="#2b3333";x.fillRect(world.ground.x,world.ground.y,world.ground.w,world.ground.h);x.fillStyle="#58615d";x.fillRect(0,500,1500,5);
for(let i=0;i<9;i++){x.fillStyle="#252d2c";x.fillRect(80+i*170,430-(i%3)*35,130,16)}
// bag
x.fillStyle="#4d3b2a";x.fillRect(world.bag.x,world.bag.y,world.bag.w,world.bag.h);x.fillStyle="#b59c67";x.fillRect(world.bag.x+8,world.bag.y+12,world.bag.w-16,6);
// door
x.fillStyle="#202828";x.fillRect(world.door.x,world.door.y,world.door.w,world.door.h);x.strokeStyle="#847354";x.lineWidth=4;x.strokeRect(world.door.x+4,world.door.y+4,world.door.w-8,world.door.h-8);x.font="34px Georgia";x.fillStyle="#c9b875";x.fillText("◈",world.door.x+19,world.door.y+78);
// wall/statue
x.fillStyle="#414846";x.fillRect(world.wall.x,world.wall.y,world.wall.w,world.wall.h);x.fillStyle="#252b2a";x.fillRect(world.wall.x-12,340,58,32);x.beginPath();x.arc(world.wall.x+8,330,24,0,Math.PI*2);x.fill();
// hero
const p=S.p;x.save();x.translate(p.x+p.w/2,p.y+p.h/2);x.scale(p.dir,1);x.fillStyle="#d0c09a";x.beginPath();x.arc(0,-18,13,0,Math.PI*2);x.fill();x.fillStyle="#29332f";x.fillRect(-15,-4,30,36);x.fillStyle="#634a36";x.fillRect(-12,30,9,27);x.fillRect(3,30,9,27);x.fillStyle="#bba56b";x.fillRect(-18,-2,36,7);x.restore();x.restore()}
let last=performance.now();function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;S.t+=dt;update(dt);draw();document.getElementById("memory").textContent="0 / 3";requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body>
</html>
