<!doctype html><html lang='ru'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'><title>THE LAST THRESHOLD — Slice 04.7</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050807;color:#eee;font-family:system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}#game{position:fixed;inset:0;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%}#hud{position:absolute;left:8px;right:8px;top:max(6px,env(safe-area-inset-top));z-index:20;display:flex;gap:7px;pointer-events:none}.card{background:#07100df3;border:1px solid #746445;border-radius:11px;padding:6px 8px;flex:1;min-width:0}.card.mem{max-width:31vw}.lab{font-size:8px;letter-spacing:.14em;color:#9ca49c}.num{font-size:13px;font-weight:900}.bar{height:6px;background:#171c19;border:1px solid #343a35;border-radius:99px;overflow:hidden;margin-top:3px}.fill{height:100%;width:100%;background:#b15f5a}.fill.st{background:#8fae83}#objective{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:19;max-width:82vw;padding:7px 10px;background:#080e0de8;border:1px solid #5b5a49;border-radius:10px;font-size:10px;line-height:1.25;text-align:center}#controls{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 8px);height:158px;z-index:50;pointer-events:none}.pad{position:absolute;left:8px;bottom:0;width:150px;height:150px;pointer-events:auto}.pad button{position:absolute;width:60px;height:60px;border:1px solid #ad9258;background:#0d1512f7;color:#f4ead3;border-radius:18px;font-size:24px;font-weight:900;box-shadow:0 7px 24px #0009;touch-action:none}.pad .up{left:45px;top:0}.pad .down{left:45px;bottom:0}.pad .left{left:0;top:45px}.pad .right{right:0;top:45px}.actions{position:absolute;right:8px;bottom:0;display:grid;grid-template-columns:98px 98px;gap:8px;width:204px;pointer-events:auto}.actions button{height:68px;border:1px solid #ad9258;background:#0d1512f7;color:#f4ead3;border-radius:18px;font-size:12px;font-weight:900;touch-action:none}.actions .wide{grid-column:1/-1;height:50px}.veil{position:absolute;inset:0;z-index:100;display:grid;place-items:center;background:#020404df;backdrop-filter:blur(6px)}.panel{width:min(660px,90vw);padding:24px;border:1px solid #d5b96f;border-radius:18px;background:#0a0f0df6}.center{text-align:center}h1{font:clamp(38px,10vw,72px) Georgia,serif;color:#e7d08f;line-height:.9;margin:0 0 8px}.sub{color:#929b94}.desc{color:#cbc7bb;line-height:1.55}.btn{width:100%;padding:14px;margin-top:9px;border:1px solid #c4a762;border-radius:12px;background:#9b8049;color:#06100c;font-weight:900}.secondary{background:#111917;color:#e2ddd0}.hidden{display:none!important}@media(max-height:700px) and (orientation:landscape){#controls{height:125px}.pad,.actions{transform:scale(.8);transform-origin:bottom left}.actions{transform-origin:bottom right}}</style></head><body><div id='game'><canvas id='c'></canvas><div id='hud'><div class='card'><div class='lab'>КАЭЛЬ</div><div>ЗДОРОВЬЕ <span id='hp' class='num'>100</span></div><div class='bar'><div id='hpF' class='fill'></div></div><div style='margin-top:4px'>ВЫНОСЛИВОСТЬ <span id='sp' class='num'>100</span></div><div class='bar'><div id='spF' class='fill st'></div></div></div><div class='card mem'><div class='lab'>ПАМЯТЬ</div><div id='shards' class='num'>ОСКОЛКИ 0/3</div></div></div><div id='objective'>Собери 3 осколка памяти и найди алтарь.</div><div id='toast'></div><div id='controls'><div class='pad'><button class='up' data-dir='up'>▲</button><button class='down' data-dir='down'>▼</button><button class='left' data-dir='left'>◀</button><button class='right' data-dir='right'>▶</button></div><div class='actions'><button data-act='jump'>ПРЫЖОК</button><button data-act='attack'>УДАР</button><button class='wide' data-act='interact'>ДЕЙСТВИЕ</button></div></div><div id='menu' class='veil'><div class='panel center'><h1>THE LAST<br>THRESHOLD</h1><div class='sub'>ПОСЛЕДНИЙ ПОРОГ · SLICE 04.7</div><p class='desc'>Усиленный прыжок, второй прыжок в воздухе и перестроенный маршрут кристаллов.</p><button id='start' class='btn'>ВОЙТИ В КАТАКОМБЫ</button><button id='load' class='btn secondary'>ЗАГРУЗИТЬ СОХРАНЕНИЕ</button></div></div><div id='pause' class='veil hidden'><div class='panel center'><h2>ПАУЗА</h2><button id='resume' class='btn'>ПРОДОЛЖИТЬ</button><button id='reset' class='btn secondary'>СБРОСИТЬ СОХРАНЕНИЕ</button></div></div><div id='modal' class='veil hidden'><div class='panel center'><h2 id='mt'></h2><div id='mb'></div><button id='ok' class='btn'>ПРОДОЛЖИТЬ</button></div></div></div><script>'use strict';const c=document.getElementById('c'),ctx=c.getContext('2d');const state={mode:'menu',t:0,keys:{},touch:{left:false,right:false,up:false,down:false},p:{x:65,y:444,w:36,h:64,vx:0,vy:0,onGround:true,jumps:0,dir:1,hp:100,sp:100,inv:0,atk:0},spawn:{x:65,y:444},shards:0,altar:false,gate:false,cameraX:0};const world={minX:20,maxX:1380,platforms:[{x:20,y:508,w:300,h:32},{x:335,y:508,w:230,h:32},{x:580,y:508,w:235,h:32},{x:830,y:508,w:210,h:32},{x:1060,y:508,w:320,h:32},{x:185,y:405,w:145,h:20},{x:385,y:345,w:150,h:20},{x:605,y:405,w:145,h:20},{x:815,y:365,w:150,h:20},{x:1035,y:305,w:170,h:20}],altar:{x:1240,y:446,w:65,h:62},door:{x:1318,y:370,w:56,h:138},trap:{x:800,y:492,w:56,h:16,armed:true},shards:[{x:255,y:355,taken:false},{x:455,y:290,taken:false},{x:1080,y:260,taken:false}]};const enemy={x:650,y:432,w:44,h:48,hp:80,dead:false,cd:0,dir:-1};function resize(){const d=Math.min(devicePixelRatio||1,2);c.width=Math.floor(innerWidth*d);c.height=Math.floor(innerHeight*d);const sc=Math.min(c.width/1400,c.height/540),ox=(c.width-1400*sc)/2,oy=(c.height-540*sc)/2;ctx.setTransform(sc,0,0,sc,ox,oy)}addEventListener('resize',resize);resize();function toast(m,ms=1300){const e=document.getElementById('toast');e.textContent=m;e.style.opacity='1';e.style.transform='translateX(-50%) translateY(0)';clearTimeout(toast.t);toast.t=setTimeout(()=>{e.style.opacity='0';e.style.transform='translateX(-50%) translateY(8px)'},ms)}function save(){localStorage.setItem('tlt_save',JSON.stringify({shards:state.shards,altar:state.altar,spawn:state.spawn,enemy:enemy.dead,gate:state.gate}))}function load(){try{const s=JSON.parse(localStorage.getItem('tlt_save')||'null');if(!s)return false;state.shards=s.shards||0;state.altar=!!s.altar;state.spawn=s.spawn||state.spawn;enemy.dead=!!s.enemy;state.gate=!!s.gate;state.p.x=state.spawn.x;state.p.y=state.spawn.y;world.shards.forEach((q,i)=>q.taken=i<state.shards);return true}catch{return false}}const menu=document.getElementById('menu'),pause=document.getElementById('pause'),modal=document.getElementById('modal');function start(){state.mode='play';menu.classList.add('hidden');toast('Прыжок усилен. Проверь верхний кристалл.',1700)}document.getElementById('start').onclick=start;document.getElementById('load').onclick=()=>load()?start():toast('Сохранения нет.');document.getElementById('resume').onclick=()=>{state.mode='play';pause.classList.add('hidden')};document.getElementById('reset').onclick=()=>{localStorage.removeItem('tlt_save');location.reload()};document.getElementById('ok').onclick=()=>modal.classList.add('hidden');addEventListener('keydown',e=>{const k=e.key.toLowerCase();state.keys[k]=1;if(k==='e')interact();if(k==='shift')attack();if(k===' ')jump();if(k==='escape'&&state.mode==='play'){state.mode='pause';pause.classList.remove('hidden')}if(k.startsWith('arrow')||k===' ')e.preventDefault()});addEventListener('keyup',e=>state.keys[e.key.toLowerCase()]=0);document.querySelectorAll('.pad button').forEach(b=>{const d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();state.touch[d]=1;b.setPointerCapture?.(e.pointerId)});['pointerup','pointercancel','pointerleave','lostpointercapture'].forEach(t=>b.addEventListener(t,e=>{e.preventDefault();state.touch[d]=0}))});document.querySelectorAll('.actions button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();const a=b.dataset.act;if(a==='jump')jump();else if(a==='attack')attack();else interact()}));function jump(){if(state.mode!=='play')return;const p=state.p;if(p.onGround){p.vy=-16.5;p.onGround=false;p.jumps=1;toast('ПРЫЖОК',240);return}if(p.jumps===1){p.vy=-14.5;p.jumps=2;toast('ВОЗДУШНЫЙ ПРЫЖОК',300)}}function attack(){const p=state.p;if(state.mode!=='play'||p.atk>0||p.sp<18)return;p.atk=.28;p.sp-=18;if(!enemy.dead&&Math.abs(p.x-enemy.x)<100&&Math.abs(p.y-enemy.y)<74){enemy.hp-=42;if(enemy.hp<=0){enemy.dead=true;if(state.shards<3)state.shards++;toast('Существо разрушено — осколок получен.');save()}else toast('Удар попал.')}}function interact(){if(state.mode!=='play')return;const p=state.p;if(Math.hypot(p.x-world.altar.x,p.y-world.altar.y)<105&&!state.altar){state.altar=true;state.spawn={x:1168,y:444};save();document.getElementById('objective').textContent='Алтарь активирован. Открой каменную дверь справа.';toast('ТОЧКА ПАМЯТИ СОХРАНЕНА',1800);return}if(Math.hypot(p.x-world.door.x,p.y-world.door.y)<110){if(state.shards>=3&&state.altar){state.gate=true;document.getElementById('mt').textContent='КАМЕННАЯ ДВЕРЬ';document.getElementById('mb').innerHTML='<p class="desc">Три осколка раскрывают замок.</p><p style="color:#d9bd73">«Каэль... не спускайся дальше один.»</p>';modal.classList.remove('hidden')}else toast('Нужны 3 осколка и активированный алтарь.')}}function respawn(msg){state.p.x=state.spawn.x;state.p.y=state.spawn.y;state.p.vy=0;state.p.onGround=true;state.p.jumps=0;state.p.hp=Math.max(1,state.p.hp-12);toast(msg,1200)}function update(dt){const p=state.p,left=state.keys.a||state.keys.arrowleft||state.touch.left,right=state.keys.d||state.keys.arrowright||state.touch.right;p.vx=(right?1:0)-(left?1:0);if(p.vx)p.dir=p.vx;p.x+=p.vx*190*dt;p.x=Math.max(world.minX,Math.min(world.maxX-p.w,p.x));p.vy+=30*dt;p.y+=p.vy*dt;p.onGround=false;for(const r of world.platforms){if(p.x+p.w>r.x&&p.x<r.x+r.w&&p.y+p.h>=r.y&&p.y+p.h<=r.y+30&&p.vy>=0){p.y=r.y-p.h;p.vy=0;p.onGround=true;p.jumps=0}}if(world.trap.armed&&p.x+p.w>world.trap.x&&p.x<world.trap.x+world.trap.w&&p.y+p.h>=world.trap.y){world.trap.armed=false;p.vy=-16;p.hp=Math.max(1,p.hp-18);toast('ЛОВУШКА!',900)}if(p.y>620)respawn('Возврат к последней точке памяти.');if(!enemy.dead){const dx=p.x-enemy.x;enemy.dir=dx>=0?1:-1;if(Math.abs(dx)<360)enemy.x+=enemy.dir*62*dt;enemy.x=Math.max(340,Math.min(920,enemy.x));enemy.cd=Math.max(0,enemy.cd-dt);if(Math.abs(dx)<58&&enemy.cd<=0&&p.inv<=0){p.hp=Math.max(1,p.hp-12);p.inv=.6;enemy.cd=.9;toast('Существо ранит Каэля.',900)}}for(const q of world.shards){if(!q.taken&&Math.hypot(p.x-q.x,p.y-q.y)<58){q.taken=true;state.shards=Math.min(3,state.shards+1);toast('ОСКОЛОК ПАМЯТИ '+state.shards+'/3',1000);save()}}if(p.hp<=0){p.hp=100;respawn('Память вернула Каэля.')}p.inv=Math.max(0,p.inv-dt);p.atk=Math.max(0,p.atk-dt);p.sp=Math.min(100,p.sp+(Math.abs(p.vx)<.05?36:12)*dt);state.cameraX=Math.max(0,Math.min(1080,p.x-700));document.getElementById('hp').textContent=Math.round(p.hp);document.getElementById('hpF').style.width=p.hp+'%';document.getElementById('sp').textContent=Math.round(p.sp);document.getElementById('spF').style.width=p.sp+'%';document.getElementById('shards').textContent='ОСКОЛКИ '+state.shards+'/3';if(state.shards>=3&&!state.altar)document.getElementById('objective').textContent='3 осколка собраны. Найди и активируй алтарь.';else if(state.altar)document.getElementById('objective').textContent='Алтарь активирован. Открой каменную дверь справа.'}function draw(){ctx.save();ctx.translate(-state.cameraX,0);const bg=ctx.createLinearGradient(0,0,0,540);bg.addColorStop(0,'#141b17');bg.addColorStop(1,'#030504');ctx.fillStyle=bg;ctx.fillRect(0,0,1400,540);for(let row=0;row<6;row++)for(let col=0;col<19;col++){const x=col*78-(row%2?39:0),y=150+row*52;ctx.fillStyle=(row+col)%2?'#1b231e':'#17201b';ctx.fillRect(x,y,72,44);ctx.strokeStyle='#2a332d';ctx.strokeRect(x,y,72,44)}for(let i=0;i<11;i++){const x=34+i*132;ctx.fillStyle='#111814';ctx.fillRect(x,138,30,343);ctx.fillStyle='#242d26';ctx.fillRect(x-7,130,44,10);ctx.fillRect(x-6,474,42,9)}for(const t of [{x:168,y:185},{x:505,y:205},{x:905,y:182},{x:1255,y:190}]){ctx.fillStyle='#503927';ctx.fillRect(t.x-4,t.y,8,28);const gl=ctx.createRadialGradient(t.x,t.y,1,t.x,t.y,48);gl.addColorStop(0,'rgba(240,195,100,.33)');gl.addColorStop(1,'rgba(240,195,100,0)');ctx.fillStyle=gl;ctx.beginPath();ctx.arc(t.x,t.y,48,0,7);ctx.fill();ctx.fillStyle='#dcc379';ctx.beginPath();ctx.ellipse(t.x,t.y-8,7,15,0,0,7);ctx.fill()}for(const r of world.platforms){ctx.fillStyle='#28312a';ctx.fillRect(r.x,r.y,r.w,r.h);ctx.fillStyle='#465246';ctx.fillRect(r.x,r.y,r.w,5)}if(world.trap.armed){ctx.fillStyle='#d2bb76';for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(world.trap.x+i*10,world.trap.y);ctx.lineTo(world.trap.x+5+i*10,world.trap.y-18);ctx.lineTo(world.trap.x+10+i*10,world.trap.y);ctx.fill()}}ctx.fillStyle='#2b362f';ctx.fillRect(world.altar.x,world.altar.y,world.altar.w,world.altar.h);ctx.fillStyle='#586659';ctx.fillRect(world.altar.x+7,world.altar.y+7,world.altar.w-14,11);if(state.altar){ctx.strokeStyle='#e0ca82';ctx.lineWidth=4;ctx.beginPath();ctx.arc(world.altar.x+32,world.altar.y+28,16,0,7);ctx.stroke()}ctx.fillStyle=state.gate?'#405c4a':'#232b26';ctx.fillRect(world.door.x,world.door.y,world.door.w,world.door.h);ctx.strokeStyle='#69766c';ctx.strokeRect(world.door.x+4,world.door.y+4,world.door.w-8,world.door.h-8);for(const q of world.shards)if(!q.taken){ctx.save();ctx.translate(q.x,q.y);ctx.rotate(Math.PI/4);ctx.fillStyle='#e1ca77';ctx.shadowBlur=22;ctx.shadowColor='#e1ca77';ctx.fillRect(-11,-11,22,22);ctx.restore()}if(!enemy.dead){ctx.fillStyle='#142019';ctx.beginPath();ctx.ellipse(enemy.x+22,enemy.y+24,22,24,0,0,7);ctx.fill();ctx.fillStyle='#a8756c';ctx.fillRect(enemy.x+9,enemy.y+14,8,6);ctx.fillRect(enemy.x+27,enemy.y+14,8,6)}const p=state.p;ctx.save();ctx.translate(p.x+p.w/2,p.y+p.h/2);ctx.scale(p.dir,1);ctx.fillStyle=p.inv?'#f0e5c2':'#d4c7aa';ctx.beginPath();ctx.arc(0,-22,15,0,7);ctx.fill();ctx.fillStyle='#28312d';ctx.fillRect(-18,-4,36,38);ctx.fillStyle='#92784a';ctx.fillRect(10,-2,23,6);if(p.atk){ctx.strokeStyle='#e8d18b';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(50,-20);ctx.stroke()}ctx.restore();ctx.fillStyle='#968b69';ctx.font='12px Georgia';ctx.fillText('ЗАЛ МЁРТВЫХ',48,118);ctx.restore()}let last=performance.now();function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;state.t+=dt;if(state.mode==='play')update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
