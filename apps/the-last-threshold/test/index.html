<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>THE LAST THRESHOLD — Slice 04.5</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050807;color:#eee;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none}#game{position:fixed;inset:0;overflow:hidden;background:#050807}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#hud{position:absolute;left:8px;right:8px;top:max(6px,env(safe-area-inset-top));z-index:20;display:flex;gap:7px;justify-content:space-between;pointer-events:none}.card{background:#07100df0;border:1px solid #746445;border-radius:11px;padding:6px 8px;box-shadow:0 7px 28px #0009;min-width:0;flex:1}.card.mem{max-width:31vw}.lab{font-size:8px;letter-spacing:.14em;color:#9ca49c}.num{font-weight:900;font-size:13px}.bar{height:6px;margin-top:3px;background:#171c19;border:1px solid #343a35;border-radius:99px;overflow:hidden}.fill{height:100%;width:100%;background:#b15f5a}.fill.st{background:#8fae83}#objective{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:19;max-width:82vw;background:#080e0de8;border:1px solid #5b5a49;border-radius:10px;padding:7px 10px;font-size:10px;line-height:1.25;text-align:center}#controls{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 8px);height:150px;z-index:50;pointer-events:none}.pad{position:absolute;left:10px;bottom:4px;width:142px;height:142px;pointer-events:auto}.pad button{position:absolute;width:58px;height:58px;border:1px solid #ad9258;background:#0d1512f5;color:#f4ead3;border-radius:17px;font-size:23px;font-weight:900;box-shadow:0 7px 24px #0009;-webkit-tap-highlight-color:transparent;touch-action:none}.pad .up{left:42px;top:0}.pad .down{left:42px;bottom:0}.pad .left{left:0;top:42px}.pad .right{right:0;top:42px}.actions{position:absolute;right:10px;bottom:4px;display:grid;grid-template-columns:92px 92px;gap:8px;width:192px;pointer-events:auto}.actions button{height:66px;border:1px solid #ad9258;background:#0d1512f5;color:#f4ead3;border-radius:17px;font-size:12px;font-weight:900;box-shadow:0 7px 24px #0009;-webkit-tap-highlight-color:transparent;touch-action:none}.actions .wide{grid-column:1/-1;height:48px}.veiled{position:absolute;inset:0;z-index:100;display:grid;place-items:center;background:#020404df;backdrop-filter:blur(6px)}.panel{width:min(660px,90vw);padding:24px;border:1px solid #d5b96f;border-radius:18px;background:#0a0f0df6;box-shadow:0 25px 80px #000}.center{text-align:center}h1{font:clamp(38px,10vw,72px) Georgia,serif;color:#e7d08f;line-height:.9;margin:0 0 8px;letter-spacing:.05em}h2{font:24px Georgia,serif;color:#e7d08f;margin:.2em 0}.sub{color:#929b94}.desc{color:#cbc7bb;line-height:1.55}.btn{width:100%;padding:14px;margin-top:9px;border:1px solid #c4a762;border-radius:12px;background:#9b8049;color:#06100c;font-weight:900;font-size:15px}.secondary{background:#111917;color:#e2ddd0}.hidden{display:none!important}#toast{position:absolute;left:50%;bottom:190px;transform:translateX(-50%) translateY(8px);opacity:0;z-index:60;background:#0a100df2;border:1px solid #ae9156;border-radius:11px;padding:10px 14px;max-width:80vw;text-align:center;transition:.18s}@media(min-width:701px){#controls{height:150px}.pad{left:18px}.actions{right:18px}}@media(max-width:700px){#objective{top:70px}.panel{padding:20px}.pad button{width:56px;height:56px}.pad{width:138px;height:138px}.pad .up{left:41px}.pad .down{left:41px}.pad .left{top:41px}.pad .right{top:41px}.actions{grid-template-columns:88px 88px;width:184px}.actions button{height:64px}.actions .wide{height:46px}}</style></head><body><div id="game"><canvas id="c"></canvas><div id="hud"><div class="card"><div class="lab">КАЭЛЬ</div><div>ЗДОРОВЬЕ <span id="hp" class="num">100</span></div><div class="bar"><div id="hpFill" class="fill"></div></div><div style="margin-top:4px">ВЫНОСЛИВОСТЬ <span id="st" class="num">100</span></div><div class="bar"><div id="stFill" class="fill st"></div></div></div><div class="card mem"><div class="lab">ПАМЯТЬ</div><div id="shards" class="num">ОСКОЛКИ 0/3</div></div></div><div id="objective">Собери 3 осколка памяти и найди алтарь.</div><div id="toast"></div><div id="controls"><div class="pad"><button class="up" data-dir="up">▲</button><button class="down" data-dir="down">▼</button><button class="left" data-dir="left">◀</button><button class="right" data-dir="right">▶</button></div><div class="actions"><button data-act="jump">ПРЫЖОК</button><button data-act="attack">УДАР</button><button class="wide" data-act="interact">ДЕЙСТВИЕ</button></div></div><div id="menu" class="veiled"><div class="panel center"><h1>THE LAST<br>THRESHOLD</h1><div class="sub">ПОСЛЕДНИЙ ПОРОГ · SLICE 04.5</div><p class="desc">Мобильная тестовая версия: крупные элементы, четыре направления и прямой сенсорный прыжок.</p><button id="start" class="btn">ВОЙТИ В КАТАКОМБЫ</button><button id="load" class="btn secondary">ЗАГРУЗИТЬ СОХРАНЕНИЕ</button></div></div><div id="pause" class="veiled hidden"><div class="panel center"><h2>ПАУЗА</h2><button id="resume" class="btn">ПРОДОЛЖИТЬ</button><button id="reset" class="btn secondary">СБРОСИТЬ СОХРАНЕНИЕ</button></div></div><div id="modal" class="veiled hidden"><div class="panel center"><h2 id="mt"></h2><div id="mb"></div><button id="ok" class="btn">ПРОДОЛЖИТЬ</button></div></div></div><script>'use strict';const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),state={mode:'menu',t:0,keys:Object.create(null),touch:{left:false,right:false,up:false,down:false},p:{x:80,y:446,w:34,h:62,vx:0,vy:0,onGround:true,dir:1,hp:100,st:100,inv:0,atk:0},spawn:{x:80,y:446},shards:0,altar:false,gate:false,cameraX:0};const world={minX:20,maxX:1380,plats:[{x:20,y:508,w:280,h:32},{x:315,y:508,w:230,h:32},{x:560,y:508,w:230,h:32},{x:805,y:508,w:230,h:32},{x:1050,y:508,w:330,h:32},{x:190,y:390,w:130,h:20},{x:385,y:330,w:140,h:20},{x:620,y:395,w:120,h:20},{x:830,y:365,w:140,h:20},{x:1055,y:300,w:145,h:20}],altar:{x:1245,y:448,w:62,h:60},door:{x:1320,y:376,w:52,h:132},trap:{x:790,y:492,w:55,h:16,armed:true},shards:[{x:255,y:348,taken:false},{x:875,y:325,taken:false},{x:1120,y:265,taken:false}]};const enemy={x:650,y:434,w:44,h:46,hp:80,dead:false,cd:0,dir:-1};function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(innerWidth*d);canvas.height=Math.floor(innerHeight*d);const scale=Math.min(canvas.width/1400,canvas.height/540),ox=(canvas.width-1400*scale)/2,oy=(canvas.height-540*scale)/2;ctx.setTransform(scale,0,0,scale,ox,oy)}addEventListener('resize',resize);resize();function toast(msg,ms=1400){const e=document.getElementById('toast');e.textContent=msg;e.style.opacity='1';e.style.transform='translateX(-50%) translateY(0)';clearTimeout(toast.t);toast.t=setTimeout(()=>{e.style.opacity='0';e.style.transform='translateX(-50%) translateY(8px)'},ms)}function save(){localStorage.setItem('tlt_save',JSON.stringify({shards:state.shards,altar:state.altar,spawn:state.spawn,enemy:enemy.dead}))}function load(){try{const s=JSON.parse(localStorage.getItem('tlt_save')||'null');if(!s)return false;state.shards=s.shards||0;state.altar=!!s.altar;state.spawn=s.spawn||state.spawn;enemy.dead=!!s.enemy;state.p.x=state.spawn.x;state.p.y=state.spawn.y;world.shards.forEach((q,i)=>q.taken=i<state.shards);return true}catch{return false}}const menu=document.getElementById('menu'),pause=document.getElementById('pause'),modal=document.getElementById('modal');function start(){state.mode='play';menu.classList.add('hidden');pause.classList.add('hidden');toast('Катакомбы. Проверь ▼ и ПРЫЖОК.',1800)}document.getElementById('start').onclick=start;document.getElementById('load').onclick=()=>load()?start():toast('Сохранения нет.');document.getElementById('resume').onclick=()=>{state.mode='play';pause.classList.add('hidden')};document.getElementById('reset').onclick=()=>{localStorage.removeItem('tlt_save');location.reload()};document.getElementById('ok').onclick=()=>modal.classList.add('hidden');addEventListener('keydown',e=>{const k=e.key.toLowerCase();state.keys[k]=true;if(k==='e')interact();if(k==='shift')attack();if(k===' ')jump();if(k==='escape'&&state.mode==='play'){state.mode='pause';pause.classList.remove('hidden')}if(k.startsWith('arrow')||k===' ')e.preventDefault()});addEventListener('keyup',e=>state.keys[e.key.toLowerCase()]=false);document.querySelectorAll('.pad button').forEach(btn=>{const dir=btn.dataset.dir;btn.addEventListener('pointerdown',e=>{e.preventDefault();state.touch[dir]=true;btn.setPointerCapture?.(e.pointerId)});['pointerup','pointercancel','pointerleave','lostpointercapture'].forEach(type=>btn.addEventListener(type,e=>{e.preventDefault();state.touch[dir]=false}))});document.querySelectorAll('.actions button').forEach(btn=>btn.addEventListener('pointerdown',e=>{e.preventDefault();const a=btn.dataset.act;if(a==='jump')jump();else if(a==='attack')attack();else interact()}));function jump(){if(state.mode!=='play')return;state.p.vy=-13.5;state.p.onGround=false;toast('ПРЫЖОК',250)}function attack(){const p=state.p;if(state.mode!=='play'||p.atk>0||p.st<18)return;p.atk=.28;p.st-=18;if(!enemy.dead&&Math.abs(p.x-enemy.x)<95&&Math.abs(p.y-enemy.y)<70){enemy.hp-=42;if(enemy.hp<=0){enemy.dead=true;state.shards=Math.min(3,state.shards+1);toast('Существо разрушено. Осколок памяти получен.');save()}else toast('Удар попал.')}}function interact(){if(state.mode!=='play')return;const p=state.p;if(Math.hypot(p.x-world.altar.x,p.y-world.altar.y)<100&&!state.altar){state.altar=true;state.spawn={x:1168,y:446};save();document.getElementById('objective').textContent='Алтарь активирован. Собери остальные осколки и открой дверь.';toast('ТОЧКА ПАМЯТИ СОХРАНЕНА',1800);return}if(Math.hypot(p.x-world.door.x,p.y-world.door.y)<110){if(state.shards>=3&&state.altar){state.gate=true;document.getElementById('mt').textContent='КАМЕННАЯ ДВЕРЬ';document.getElementById('mb').innerHTML='<p class="desc">Три осколка сходятся в древнем замке.</p><p style="color:#d9bd73">«Каэль... не спускайся дальше один.»</p>';modal.classList.remove('hidden')}else toast('Нужны 3 осколка и активированный алтарь.')}}function update(dt){const p=state.p,left=state.keys.a||state.keys.arrowleft||state.touch.left,right=state.keys.d||state.keys.arrowright||state.touch.right;p.vx=(right?1:0)-(left?1:0);if(p.vx)p.dir=p.vx;p.x+=p.vx*180*dt;p.x=Math.max(world.minX,Math.min(world.maxX-p.w,p.x));p.vy+=30*dt;p.y+=p.vy*dt;p.onGround=false;for(const r of world.plats){if(p.x+p.w>r.x&&p.x<r.x+r.w&&p.y+p.h>=r.y&&p.y+p.h<=r.y+28&&p.vy>=0){p.y=r.y-p.h;p.vy=0;p.onGround=true}}if(world.trap.armed&&p.x+p.w>world.trap.x&&p.x<world.trap.x+world.trap.w&&p.y+p.h>=world.trap.y){world.trap.armed=false;p.vy=-14;p.hp=Math.max(1,p.hp-18);toast('ЛОВУШКА!',800)}if(p.y>620){p.x=state.spawn.x;p.y=state.spawn.y;p.vy=0;p.hp=Math.max(1,p.hp-20);toast('Возврат к точке памяти.',1000)}if(!enemy.dead){const dx=p.x-enemy.x;enemy.dir=dx>=0?1:-1;if(Math.abs(dx)<360)enemy.x+=enemy.dir*64*dt;enemy.x=Math.max(350,Math.min(930,enemy.x));enemy.cd=Math.max(0,enemy.cd-dt);if(Math.abs(dx)<58&&enemy.cd<=0&&p.inv<=0){p.hp=Math.max(1,p.hp-12);p.inv=.6;enemy.cd=.9;toast('Существо ранит Каэля.',800)}}for(const q of world.shards){if(!q.taken&&Math.hypot(p.x-q.x,p.y-q.y)<52){q.taken=true;state.shards++;toast('ОСКОЛОК ПАМЯТИ '+state.shards+'/3',900);save()}}if(p.hp<=0){p.hp=100;p.x=state.spawn.x;p.y=state.spawn.y;p.vy=0;toast('Память вернула Каэля.',1000)}p.inv=Math.max(0,p.inv-dt);p.atk=Math.max(0,p.atk-dt);p.st=Math.min(100,p.st+(Math.abs(p.vx)<.05?36:12)*dt);state.cameraX=Math.max(0,Math.min(1080,p.x-700));document.getElementById('hp').textContent=Math.round(p.hp);document.getElementById('hpFill').style.width=p.hp+'%';document.getElementById('st').textContent=Math.round(p.st);document.getElementById('stFill').style.width=p.st+'%';document.getElementById('shards').textContent='ОСКОЛКИ '+state.shards+'/3';if(state.shards>=3&&!state.altar)document.getElementById('objective').textContent='3 осколка собраны. Найди и активируй алтарь.';else if(state.altar)document.getElementById('objective').textContent='Алтарь активирован. Открой каменную дверь справа.'}function draw(){ctx.save();ctx.translate(-state.cameraX,0);const bg=ctx.createLinearGradient(0,0,0,540);bg.addColorStop(0,'#141b17');bg.addColorStop(1,'#020403');ctx.fillStyle=bg;ctx.fillRect(0,0,1400,540);ctx.fillStyle='#070a08';for(let i=0;i<26;i++){const xx=i*58;ctx.beginPath();ctx.moveTo(xx,92);ctx.lineTo(xx+28,122+(i%4)*10);ctx.lineTo(xx+58,92);ctx.closePath();ctx.fill()}for(let row=0;row<6;row++)for(let col=0;col<19;col++){const xx=col*78-(row%2?35:0),yy=155+row*52;ctx.fillStyle=(row+col)%2?'#1b231e':'#17201b';ctx.fillRect(xx,yy,72,44);ctx.strokeStyle='#2a332c';ctx.strokeRect(xx,yy,72,44)}for(let i=0;i<11;i++){const xx=34+i*132;ctx.fillStyle='#111814';ctx.fillRect(xx,140,30,340);ctx.fillStyle='#242d26';ctx.fillRect(xx-7,132,44,10);ctx.fillRect(xx-6,474,42,9)}for(const t of [{x:170,y:184},{x:505,y:215},{x:905,y:188},{x:1255,y:190}]){ctx.fillStyle='#4a3827';ctx.fillRect(t.x-4,t.y,8,28);const gl=ctx.createRadialGradient(t.x,t.y,1,t.x,t.y,50);gl.addColorStop(0,'rgba(230,190,100,.34)');gl.addColorStop(1,'rgba(230,190,100,0)');ctx.fillStyle=gl;ctx.beginPath();ctx.arc(t.x,t.y,50,0,Math.PI*2);ctx.fill();ctx.fillStyle='#dbc477';ctx.beginPath();ctx.ellipse(t.x,t.y-8,7,15,0,0,Math.PI*2);ctx.fill()}for(const r of world.platforms){ctx.fillStyle='#273029';ctx.fillRect(r.x,r.y,r.w,r.h);ctx.fillStyle='#465146';ctx.fillRect(r.x,r.y,r.w,5)}if(world.trap.armed){ctx.fillStyle='#d3bc78';for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(world.trap.x+i*10,world.trap.y);ctx.lineTo(world.trap.x+5+i*10,world.trap.y-18);ctx.lineTo(world.trap.x+10+i*10,world.trap.y);ctx.fill()}}ctx.fillStyle='#29352e';ctx.fillRect(world.altar.x,world.altar.y,world.altar.w,world.altar.h);if(state.altar){ctx.strokeStyle='#e0ca82';ctx.lineWidth=4;ctx.beginPath();ctx.arc(world.altar.x+31,world.altar.y+27,15,0,Math.PI*2);ctx.stroke()}ctx.fillStyle=state.gate?'#405c4a':'#222a25';ctx.fillRect(world.door.x,world.door.y,world.door.w,world.door.h);world.shards.forEach(q=>{if(!q.taken){ctx.save();ctx.translate(q.x,q.y);ctx.rotate(Math.PI/4);ctx.fillStyle='#e1ca77';ctx.shadowBlur=22;ctx.shadowColor='#e1ca77';ctx.fillRect(-10,-10,20,20);ctx.restore()}});if(!enemy.dead){ctx.fillStyle='#142019';ctx.beginPath();ctx.ellipse(enemy.x+22,enemy.y+23,22,23,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ab7770';ctx.fillRect(enemy.x+9,enemy.y+14,8,6);ctx.fillRect(enemy.x+27,enemy.y+14,8,6)}const p=state.p;ctx.save();ctx.translate(p.x+p.w/2,p.y+p.h/2);ctx.scale(p.dir,1);ctx.fillStyle=p.inv?'#f0e5c2':'#d0c4a9';ctx.beginPath();ctx.arc(0,-19,14,0,Math.PI*2);ctx.fill();ctx.fillStyle='#28312c';ctx.fillRect(-17,-3,34,37);ctx.fillStyle='#92784a';ctx.fillRect(9,-1,22,6);if(p.atk){ctx.strokeStyle='#e6d08b';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(48,-19);ctx.stroke()}ctx.restore();ctx.fillStyle='#948a68';ctx.font='12px Georgia';ctx.fillText('ЗАЛ МЁРТВЫХ',52,120);ctx.restore()}let last=performance.now();function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;state.t+=dt;if(state.mode==='play')update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
